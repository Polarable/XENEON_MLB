<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baseball News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Design tokens: shared by every tab (news now, scores and standings later). */
  :root {
    --bg: #000;
    --surface: #111;
    --surface-2: #1c1c1c;
    --line: rgba(255,255,255,.10);
    --line-2: rgba(255,255,255,.14);
    --text: #fff;
    --text-2: rgba(255,255,255,.62);
    --text-3: rgba(255,255,255,.40);
    --text-4: rgba(255,255,255,.28);
    --radius: 14px;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Inter Tight", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }

  /* Fixed 2560x720 stage, scaled to whatever space iCUE gives us. */
  #stage { position: absolute; top: 0; left: 0; width: 2560px; height: 720px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }

  /* Team mode: a very faint wash of the selected team's color from the top-left. */
  #glow { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s var(--ease);
    background: radial-gradient(ellipse 1800px 600px at 0% 0%, rgba(var(--team-rgb, 0,0,0), .10), transparent 70%); }
  #stage.team #glow { opacity: 1; }

  /* Header: tab words, team picker, source line. */
  header { position: absolute; top: 36px; left: 40px; right: 40px; height: 56px; display: flex; align-items: center; gap: 44px; }
  nav { display: flex; align-items: baseline; gap: 32px; }
  nav .tab { font-size: 44px; font-weight: 600; letter-spacing: -1px; line-height: 1; color: var(--text-4); }
  nav .tab.on { color: var(--text); }
  #picker-btn { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 22px 0 16px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid var(--line-2); color: var(--text);
    font: 500 20px "Inter Tight", sans-serif; cursor: pointer; }
  #picker-label { display: flex; align-items: center; gap: 10px; }
  #picker-btn img { width: 26px; height: 26px; }
  #picker-btn .chev { width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: translateY(-3px) rotate(45deg); margin-left: 2px; opacity: .6; }
  #updated { margin-left: auto; font-size: 18px; font-weight: 500; color: var(--text-3); }

  /* Card row */
  #row { position: absolute; top: 100px; left: 0; right: 0; height: 568px; display: flex; gap: 24px;
    padding: 24px 40px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-padding: 0 40px; scrollbar-width: none;
    touch-action: pan-x;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 240px)), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 240px)), transparent 100%); }
  #row::-webkit-scrollbar { display: none; }

  .card { position: relative; flex: 0 0 520px; height: 520px; border-radius: var(--radius); scroll-snap-align: start;
    border: 1px solid var(--line); color: inherit; text-decoration: none; overflow: hidden; isolation: isolate; background: var(--surface);
    opacity: 0; animation: card-in .5s var(--ease) forwards; animation-delay: var(--delay, 0ms);
    transition: transform .15s var(--ease); }
  .card.hero { flex-basis: 1064px; }
  .card:active { transform: scale(.98); }
  @keyframes card-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* Fallback sits under the photo, so loading and missing photos still look intentional. */
  .card .fallback { position: absolute; inset: 0; z-index: -2; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #1a1a1a, #0b0b0b); }
  .card .fallback img { width: 96px; opacity: .5; transform: translateY(-70px); }
  .card .photo { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; object-fit: cover;
    filter: saturate(.92) contrast(1.04); opacity: 0; transition: opacity .6s var(--ease); }
  .card .photo.on { opacity: 1; }
  .card .shade { position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.7) 34%, rgba(0,0,0,0) 70%); }

  .card .text { position: absolute; left: 32px; right: 32px; bottom: 30px; }
  .card .kicker { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 19px; font-weight: 500; color: var(--text-2); }
  .card .kicker::before { content: ""; width: 4px; height: 20px; border-radius: 2px; background: var(--tc); }
  .card .kicker .team { color: var(--text); font-weight: 600; }
  .card .kicker .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
  .card .new { padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,.12); color: var(--text);
    font-size: 14px; font-weight: 600; letter-spacing: 1px; }
  .card h2 { font-size: 36px; font-weight: 600; line-height: 1.14; letter-spacing: -0.6px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card.hero h2 { font-size: 54px; line-height: 1.06; letter-spacing: -1.2px; max-width: 900px; }
  .card.hero .kicker { font-size: 20px; }

  .empty { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; transform: translateY(-20px); }
  .empty img { width: 96px; height: 96px; opacity: .6; }
  .empty div { font-size: 30px; font-weight: 500; color: var(--text-3); }

  /* Team picker popover */
  #picker { position: absolute; top: 108px; left: 40px; display: none; padding: 20px; border-radius: 16px; z-index: 10;
    background: rgba(18,18,18,.97); border: 1px solid var(--line-2); box-shadow: 0 24px 80px rgba(0,0,0,.85);
    grid-template-columns: repeat(11, 140px); gap: 10px; }
  #picker.open { display: grid; animation: pop .18s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  #picker button { height: 88px; border: 1px solid transparent; border-radius: 10px; background: var(--surface-2); color: var(--text);
    font: 600 18px "Inter Tight", sans-serif; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
  #picker button img { width: 40px; height: 40px; }
  #picker button.on { background: #262626; border-color: rgba(255,255,255,.4); }
  #scrim { position: absolute; inset: 0; display: none; z-index: 9; }
  #scrim.open { display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <header>
    <nav>
      <span class="tab on">News</span>
      <span class="tab" title="Coming soon">Scores</span>
      <span class="tab" title="Coming soon">Standings</span>
    </nav>
    <button id="picker-btn" aria-haspopup="true"><span id="picker-label">All teams</span><span class="chev"></span></button>
    <div id="updated"></div>
  </header>
  <div id="row"></div>
  <div id="scrim"></div>
  <div id="picker" role="menu"></div>
</div>

<script src="teams.js"></script>
<script>
  const REFRESH_MS = 5 * 60 * 1000;   // re-read news.json every 5 minutes
  const NEW_MIN = 60;                 // stories younger than this get a NEW tag
  const LEAGUE = { abbr: "MLB", name: "MLB", color: "#c8102e", bright: "#e8283f" };
  // Logos live in logos/ (downloaded by scripts/fetch-logos.js); fall back to MLB's dark-background version online.
  const logo = (t) => `logos/${t.abbr}.svg`;
  const logoFallback = (t) => `https://www.mlbstatic.com/team-logos/team-cap-on-dark/${t.id}.svg`;
  const logoImg = (t, cls = "") => t.id ? `<img class="${cls}" src="${logo(t)}" data-fb="${logoFallback(t)}" alt="" onerror="fb(this)">` : "";
  // Try the online logo if the local one is missing, then hide it.
  function fb(img) { if (img.dataset.fb && !img.dataset.tried) { img.dataset.tried = 1; img.src = img.dataset.fb; } else img.remove(); }
  const byAbbr = Object.fromEntries(TEAMS.map((t) => [t.abbr, t]));
  let articles = [];
  let lastKey = "";
  let selected = load("team") || "ALL";
  if (selected !== "ALL" && !byAbbr[selected]) selected = "ALL";

  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch {} }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return `${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}`; };
  const vars = (t) => `--tc:${t.bright};--tc-rgb:${rgb(t.bright)}`;

  // Scale the 2560x720 stage to fit the iframe.
  function fit() {
    const s = Math.min(innerWidth / 2560, innerHeight / 720);
    const stage = document.getElementById("stage");
    stage.style.transform = `scale(${s})`;
    stage.style.left = `${(innerWidth - 2560 * s) / 2}px`;
    stage.style.top = `${(innerHeight - 720 * s) / 2}px`;
  }
  addEventListener("resize", fit); fit();

  const minutes = (iso) => Math.max(0, (Date.now() - new Date(iso)) / 60000);
  function ago(iso) {
    const m = minutes(iso);
    if (m < 1) return "Just now";
    if (m < 60) return `${Math.round(m)}m ago`;
    if (m < 1440) return `${Math.round(m / 60)}h ago`;
    return `${Math.round(m / 1440)}d ago`;
  }

  // Soft edges on the row: fade the right edge while there's more to scroll, the left once scrolled.
  function edges() {
    const row = document.getElementById("row");
    const atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 4;
    row.style.setProperty("--fade-r", atEnd ? "0px" : "240px");
    row.style.setProperty("--fade-l", row.scrollLeft > 4 ? "120px" : "0px");
  }
  document.getElementById("row").addEventListener("scroll", edges, { passive: true });

  function applyTeamMode(team) {
    const stage = document.getElementById("stage");
    stage.classList.toggle("team", !!team);
    if (team) stage.style.setProperty("--team-rgb", rgb(team.bright));
    document.getElementById("picker-label").innerHTML = team ? `${logoImg(team)} ${esc(team.name)}` : "All teams";
  }

  function card(a, t, i) {
    const hero = i === 0;
    const isNew = minutes(a.date) < NEW_MIN;
    return `<a class="card${hero ? " hero" : ""}" href="${esc(a.link)}" target="_blank" rel="noopener"
        style="${vars(t)};--delay:${Math.min(i, 8) * 40}ms">
      <div class="fallback">${logoImg(t)}</div>
      ${a.image ? `<img class="photo" src="${esc(a.image)}" alt="" onload="this.classList.add('on')" onerror="this.remove()">` : ""}
      <div class="shade"></div>
      <div class="text">
        <div class="kicker"><span class="team">${esc(t.name)}</span><span class="sep"></span><span class="age" data-d="${esc(a.date)}">${ago(a.date)}</span>${isNew ? `<span class="new">NEW</span>` : ""}</div>
        <h2>${esc(a.title)}</h2>
      </div></a>`;
  }

  function render() {
    const team = byAbbr[selected];
    applyTeamMode(team);
    const list = (team ? articles.filter((a) => a.teams.includes(team.abbr)) : articles).slice(0, 20);
    const row = document.getElementById("row");
    row.innerHTML = list.length
      ? list.map((a, i) => card(a, team || byAbbr[a.teams[0]] || LEAGUE, i)).join("")
      : `<div class="empty">${team ? logoImg(team) : ""}<div>No recent news${team ? ` for the ${esc(team.name)}` : ""}</div></div>`;
    row.scrollLeft = 0;
    edges();
    document.querySelectorAll("#picker button").forEach((b) => b.classList.toggle("on", b.dataset.t === selected));
  }

  function buildPicker() {
    const opts = [{ abbr: "ALL" }, ...[...TEAMS].sort((a, b) => a.abbr.localeCompare(b.abbr))];
    document.getElementById("picker").innerHTML = opts.map((t) =>
      `<button data-t="${t.abbr}" >${t.id ? logoImg(t) : `<span style="font-size:30px">⚾</span>`}${t.abbr}</button>`).join("");
  }
  function togglePicker(open) {
    document.getElementById("picker").classList.toggle("open", open);
    document.getElementById("scrim").classList.toggle("open", open);
  }
  document.getElementById("picker-btn").onclick = () => togglePicker(!document.getElementById("picker").classList.contains("open"));
  document.getElementById("scrim").onclick = () => togglePicker(false);
  document.getElementById("picker").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    selected = b.dataset.t; save("team", selected); togglePicker(false); render();
  };

  async function refresh() {
    try {
      const data = await (await fetch(`news.json?t=${Date.now()}`, { cache: "no-store" })).json();
      document.getElementById("updated").textContent =
        `MLB Trade Rumors · updated ${new Date(data.updated).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
      // Only rebuild the row when the stories changed, so a refresh doesn't yank the user back to the start.
      const key = (data.articles || []).map((a) => a.link).join("|");
      articles = data.articles || [];
      if (key !== lastKey) { lastKey = key; render(); }
      else document.querySelectorAll(".age[data-d]").forEach((el) => { el.textContent = ago(el.dataset.d); });
    } catch (e) {
      document.getElementById("updated").textContent = "Couldn't load news";
    }
  }

  buildPicker(); render(); refresh(); setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
