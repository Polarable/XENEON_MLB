<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHUTOUT Baseball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="views.css?v=__BUILD__" rel="stylesheet">
<link href="bracket.css?v=__BUILD__" rel="stylesheet">
<style>
  /* Design tokens: shared by every tab (news now, scores and standings later). */
  :root {
    --bg: #000;
    --surface: #111;
    --surface-2: #1c1c1c;
    --line: rgba(255,255,255,.10);
    --line-2: rgba(255,255,255,.14);
    --text: #fff;
    --text-2: rgba(255,255,255,.62);
    --text-3: rgba(255,255,255,.40);
    --text-4: rgba(255,255,255,.28);
    --radius: 14px;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Inter Tight", "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }

  /* Fixed 2560x720 stage, scaled to whatever space iCUE gives us. */
  #stage { position: absolute; top: 0; left: 0; width: 2560px; height: 720px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }

  /* Team mode: a very faint wash of the selected team's color from the top-left. */
  #glow { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s var(--ease);
    background: radial-gradient(ellipse 1800px 600px at 0% 0%, rgba(var(--team-rgb, 0,0,0), .10), transparent 70%); }
  #stage.team #glow { opacity: 1; }

  /* Header: tab words, team picker, source line. */
  header { position: absolute; top: 36px; left: 40px; right: 40px; height: 56px; display: flex; align-items: center; gap: 44px; }
  nav { display: flex; align-items: center; gap: 32px; height: 56px; }
  nav .tab { font-size: 44px; font-weight: 600; letter-spacing: -1px; line-height: 56px; color: var(--text-4); }
  nav .tab.on { color: var(--text); }
  #picker-btn { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 22px 0 16px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid var(--line-2); color: var(--text);
    font: 500 20px "Inter Tight", sans-serif; cursor: pointer; }
  #picker-label { display: flex; align-items: center; gap: 10px; line-height: 1; }
  #picker-btn img { width: 28px; height: 28px; display: block; }
  #picker-btn .chev { width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: translateY(-3px) rotate(45deg); margin-left: 2px; opacity: .6; }
  /* Brand corner: logo, wordmark, then the last-updated time. */
  #brand { margin-left: auto; display: flex; align-items: center; height: 56px; }
  #brand img { height: 40px; width: auto; display: block; opacity: .92; }
  #brand .name { margin-left: 14px; font-size: 20px; font-weight: 700; letter-spacing: .22em; line-height: 1; color: var(--text);
    margin-right: -.22em; /* cancel the trailing letter-spacing so the gaps look even */ }
  #brand .sep { width: 1px; height: 24px; margin: 0 20px; background: var(--line-2); }
  #updated { font-size: 18px; font-weight: 500; line-height: 1; color: var(--text-3); font-variant-numeric: tabular-nums; }

  /* Card row: cards are laid out by script so the leftmost one can grow into the headliner as you scroll. */
  #row { position: absolute; top: -16px; left: 0; right: 0; height: 636px; overflow: hidden; touch-action: none; cursor: grab;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - var(--fade-r, 240px)), transparent 100%);
            mask-image: linear-gradient(to right, #000 calc(100% - var(--fade-r, 240px)), transparent 100%); }
  #row.dragging { cursor: grabbing; }

  .card { position: absolute; top: 24px; left: 0; width: 592px; height: 592px; border-radius: var(--radius); --w: 0;
    color: inherit; overflow: hidden; isolation: isolate; cursor: pointer;
    opacity: 0;
    transition: transform .15s var(--ease); }
  /* Team-color ring: a slowly turning gradient border with a soft glow in the same color. */
  @property --ring { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  .card { border: 3px solid transparent;
    background: linear-gradient(var(--surface), var(--surface)) padding-box,
                conic-gradient(from var(--ring), var(--tc), rgba(var(--tc-rgb), .25) 22%, var(--primary) 40%, var(--tc) 55%, rgba(var(--tc-rgb), .25) 78%, var(--tc)) border-box;
    box-shadow: 0 0 36px rgba(var(--tc-rgb), .32), 0 14px 40px rgba(0,0,0,.6);
    animation: card-in .5s var(--ease) forwards var(--delay, 0ms), ring 14s linear infinite; }
  @keyframes ring { to { --ring: 360deg; } }
  .card:active { transform: scale(.98); }
  @keyframes card-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* Fallback sits under the photo, so loading and missing photos still look intentional. */
  .card .fallback { position: absolute; inset: 0; z-index: -2; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #1a1a1a, #0b0b0b); }
  .card .fallback img { width: 96px; opacity: .5; transform: translateY(-70px); }
  .card .photo { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; object-fit: cover;
    filter: saturate(.92) contrast(1.04); opacity: 0; transition: opacity .6s var(--ease); }
  .card .photo.on { opacity: 1; }
  .card .shade { position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.7) 34%, rgba(0,0,0,0) 70%); }

  .card .text { position: absolute; left: 32px; right: 32px; bottom: 30px; }
  .card .kicker { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 19px; font-weight: 500; color: var(--text-2); }
  .card .kicker img { width: 30px; height: 30px; display: block; filter: drop-shadow(0 1px 4px rgba(0,0,0,.6)); }
  .card .kicker .team { color: var(--text); font-weight: 600; }
  .card .kicker .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
  .new { padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,.12); color: var(--text);
    font-size: 14px; font-weight: 600; letter-spacing: 1px; }
  /* --w runs 0 (regular card) to 1 (headliner) and scales the headline and the preview text in between. */
  .card h2 { font-size: calc(38px + 22px * var(--w)); font-weight: 600; line-height: calc(1.14 - .08 * var(--w));
    letter-spacing: calc(-0.6px - 0.6px * var(--w)); max-width: 940px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .preview { max-width: 900px; margin-top: calc(16px * var(--w)); max-height: calc(132px * var(--w)); opacity: calc(var(--w) * 1.4 - .4);
    font-size: 23px; line-height: 1.45; color: var(--text-2); overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  .card .read { margin-left: auto; color: var(--text-3); font-size: 17px; opacity: var(--w); }

  /* Reader: tap a card to read its preview without leaving the widget. */
  #reader { position: absolute; inset: 0; z-index: 40; display: none; background: #000; }
  #reader.open { display: flex; animation: pop .22s var(--ease); }
  #reader .r-photo { position: relative; flex: 0 0 900px; height: 720px; background: var(--surface) center/cover no-repeat; }
  #reader .r-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, transparent 55%, #000); }
  #reader .r-photo img.logo { position: absolute; left: 50%; top: 50%; width: 140px; transform: translate(-50%, -50%); opacity: .5; }
  #reader .r-main { flex: 1; min-width: 0; padding: 56px 120px 48px 64px; display: flex; flex-direction: column; }
  #reader .kicker { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 500; color: var(--text-2); }
  #reader .kicker img { width: 32px; height: 32px; }
  #reader .kicker .team { color: var(--text); font-weight: 600; }
  #reader .kicker .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
  #reader h2 { margin-top: 18px; font-size: 52px; font-weight: 600; line-height: 1.06; letter-spacing: -1.2px; max-width: 1400px; }
  #reader .r-body { flex: 1; min-height: 0; margin-top: 28px; column-width: 520px; column-gap: 56px; column-fill: auto;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none; touch-action: pan-x;
    font-size: 23px; line-height: 1.5; color: rgba(255,255,255,.82); }
  #reader .r-body::-webkit-scrollbar { display: none; }
  #reader .r-body p { margin-bottom: 18px; break-inside: avoid-column; }
  #reader .plink { color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: rgba(255,255,255,.3);
    text-decoration-thickness: 1px; text-underline-offset: .18em; }
  #reader .r-body .plink { color: #fff; }
  #reader .plink:active { text-decoration-color: #fff; }
  #reader .r-foot { display: flex; align-items: center; gap: 20px; margin-top: 20px; }
  #reader .r-link { display: flex; align-items: center; height: 56px; padding: 0 26px; border-radius: 999px; background: #fff; color: #000;
    font-size: 20px; font-weight: 600; text-decoration: none; }
  #reader .r-step { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  #reader .r-step button { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(255,255,255,.06);
    color: #fff; font: 400 36px/1 "Inter Tight", sans-serif; cursor: pointer; }
  #reader .r-step button:disabled { opacity: .25; cursor: default; }
  #reader .r-step button:active:not(:disabled) { background: rgba(255,255,255,.16); }
  #reader .r-pos { min-width: 92px; text-align: center; font-size: 18px; font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; }
  #reader.slide-l .r-main { animation: r-in-l .28s var(--ease); }
  #reader.slide-r .r-main { animation: r-in-r .28s var(--ease); }
  @keyframes r-in-l { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes r-in-r { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: none; } }
  #reader .r-note { font-size: 17px; color: var(--text-3); }
  #reader .r-close { position: absolute; top: 40px; right: 40px; width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line-2);
    background: rgba(255,255,255,.06); color: #fff; font: 400 34px/1 "Inter Tight", sans-serif; cursor: pointer; }

  .empty { position: absolute; inset: 0; display: flex; justify-content: center; flex-direction: column; align-items: center; gap: 20px; transform: translateY(-20px); }
  .empty img { width: 96px; height: 96px; opacity: .6; }
  .empty div { font-size: 30px; font-weight: 500; color: var(--text-3); }

  /* Team picker popover */
  #picker { position: absolute; top: 108px; left: 40px; display: none; padding: 20px; border-radius: 16px; z-index: 10;
    background: rgba(18,18,18,.97); border: 1px solid var(--line-2); box-shadow: 0 24px 80px rgba(0,0,0,.85);
    grid-template-columns: repeat(11, 140px); gap: 10px; }
  #picker.open { display: grid; animation: pop .18s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  #picker button { height: 88px; border: 1px solid transparent; border-radius: 10px; background: var(--surface-2); color: var(--text);
    font: 600 18px "Inter Tight", sans-serif; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
  #picker button img { width: 40px; height: 40px; }
  #picker button.on { background: #262626; border-color: rgba(255,255,255,.4); }
  #scrim { position: absolute; inset: 0; display: none; z-index: 9; }
  #scrim.open { display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <header>
    <nav>
      <span class="tab" data-tab="myteam" role="button"><span class="mt-tab-l">My team</span></span>
      <span class="tab on" data-tab="news" role="button">News</span>
      <span class="tab" data-tab="scores" role="button">Scores</span>
      <span class="tab" data-tab="standings" role="button">Standings</span>
      <span class="tab" data-tab="rosters" role="button">Rosters</span>
    </nav>
    <button id="picker-btn" aria-haspopup="true"><span id="picker-label">All teams</span><span class="chev"></span></button><button id="picker-clear" aria-label="Show all teams">×</button>
    <div id="ctx"></div>
    <div id="brand">
      <img src="brand/shutout-logo.png" alt="">
      <span class="name">SHUTOUT</span>
      <span class="sep"></span>
      <span id="updated"></span>
      <button id="settings-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
    </div>
  </header>
  <div class="view" id="view-myteam"><div id="myteam-body"></div></div>
  <div class="view on" id="view-news"><div id="row"></div></div>
  <div class="view" id="view-scores"><div id="scores-row"></div></div>
  <div class="view" id="view-standings"><div id="standings-body"></div></div>
  <div class="view" id="view-rosters"><div id="rosters-body"></div></div>
  <div id="sheet"><div class="s-body"></div>
    <div class="s-nav"><button class="s-back">‹ Back</button><button class="s-close" aria-label="Close">×</button></div></div>
  <div id="scrim"></div>
  <div id="reader">
    <div class="r-photo"></div>
    <div class="r-main">
      <div class="kicker"></div>
      <h2></h2>
      <div class="r-body"></div>
      <div class="r-foot"><a class="r-link" target="_blank" rel="noopener">Read on MLB Trade Rumors</a><span class="r-step"><button data-step="-1" aria-label="Previous story">‹</button><span class="r-pos"></span><button data-step="1" aria-label="Next story">›</button></span><span class="r-note"></span></div>
    </div>
    <button class="r-close" aria-label="Close">×</button>
  </div>
  <div id="picker" role="menu"></div>
</div>

<script src="teams.js?v=__BUILD__"></script>
<script src="mlb.js?v=__BUILD__"></script>
<script src="sheet.js?v=__BUILD__"></script>
<script src="settings.js?v=__BUILD__"></script>
<script src="scores.js?v=__BUILD__"></script>
<script src="standings.js?v=__BUILD__"></script>
<script src="bracket.js?v=__BUILD__"></script>
<script src="leaders.js?v=__BUILD__"></script>
<script src="team.js?v=__BUILD__"></script>
<script src="savant.js?v=__BUILD__"></script>
<script src="newslinks.js?v=__BUILD__"></script>
<script src="player.js?v=__BUILD__"></script>
<script src="gameday.js?v=__BUILD__"></script>
<script src="game.js?v=__BUILD__"></script>
<script src="myteam.js?v=__BUILD__"></script>
<script src="livebar.js?v=__BUILD__"></script>
<script src="search.js?v=__BUILD__"></script>
<script src="hotstove.js?v=__BUILD__"></script>
<script src="idle.js?v=__BUILD__"></script>
<script>
  const REFRESH_MS = 5 * 60 * 1000;   // re-read news.json every 5 minutes
  const NEW_MIN = 60;                 // stories younger than this get a NEW tag
  const LEAGUE = { abbr: "MLB", name: "MLB", color: "#c8102e", bright: "#e8283f" };
  // Logos live in logos/ (downloaded by scripts/fetch-logos.js); fall back to MLB's dark-background version online.
  const logo = (t) => `logos/${t.abbr}.svg?v=__BUILD__`;
  const logoFallback = (t) => `https://www.mlbstatic.com/team-logos/team-cap-on-dark/${t.id}.svg`;
  const logoImg = (t, cls = "") => t.id ? `<img class="${cls}" src="${logo(t)}" data-fb="${logoFallback(t)}" alt="" onerror="fb(this)">` : "";
  // Try the online logo if the local one is missing, then hide it.
  function fb(img) { if (img.dataset.fb && !img.dataset.tried) { img.dataset.tried = 1; img.src = img.dataset.fb; } else img.remove(); }
  const byAbbr = Object.fromEntries(TEAMS.map((t) => [t.abbr, t]));
  let articles = [];
  let lastKey = "";
  let selected = load("team") || "ALL";
  if (selected !== "ALL" && !byAbbr[selected]) selected = "ALL";

  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch {} }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return `${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}`; };
  const vars = (t) => `--tc:${t.bright};--tc-rgb:${rgb(t.bright)};--primary:${t.color}`;

  // Scale the 2560x720 stage to fit the iframe. CSS zoom re-lays out and re-rasterizes the text at the
  // final size, so it stays sharp; a transform scale would resample an already-drawn bitmap and blur it.
  // `scale` is what the pointer and getBoundingClientRect math divides by (measured, so it matches the engine).
  let scale = 1;
  const ZOOM = typeof CSS !== "undefined" && CSS.supports && CSS.supports("zoom", "2");
  function fit() {
    const s = Math.min(innerWidth / 2560, innerHeight / 720);
    const stage = document.getElementById("stage");
    const x = Math.round((innerWidth - 2560 * s) / 2), y = Math.round((innerHeight - 720 * s) / 2);
    if (ZOOM && Math.abs(s - 1) > 0.001) {
      stage.style.transform = "";
      stage.style.zoom = s;
      // A zoomed element's own left/top are zoomed too.
      stage.style.left = `${x / s}px`; stage.style.top = `${y / s}px`;
    } else {
      stage.style.zoom = "";
      stage.style.transform = Math.abs(s - 1) > 0.001 ? `scale(${s})` : "";
      stage.style.left = `${x}px`; stage.style.top = `${y}px`;
    }
    scale = stage.getBoundingClientRect().width / 2560 || s;
  }
  addEventListener("resize", fit); fit();

  const minutes = (iso) => Math.max(0, (Date.now() - new Date(iso)) / 60000);
  function ago(iso) {
    const m = minutes(iso);
    if (m < 1) return "Just now";
    if (m < 60) return `${Math.round(m)}m ago`;
    if (m < 1440) return `${Math.round(m / 60)}h ago`;
    return `${Math.round(m / 1440)}d ago`;
  }

  function applyTeamMode(team) {
    const stage = document.getElementById("stage");
    stage.classList.toggle("team", !!team);
    if (team) stage.style.setProperty("--team-rgb", rgb(team.bright));
    document.getElementById("picker-label").innerHTML = team ? `${logoImg(team)} ${esc(team.name)}` : "All teams";
    document.getElementById("picker-clear").classList.toggle("on", !!team);
  }

  const kicker = (a, t) => `${logoImg(t)}<span class="team">${esc(t.name)}</span><span class="sep"></span>` +
    `<span class="age" data-d="${esc(a.date)}">${ago(a.date)}</span>${minutes(a.date) < NEW_MIN ? `<span class="new">NEW</span>` : ""}`;

  function card(a, t, i) {
    const preview = (a.body || [])[0] || "";
    return `<div class="card" data-i="${i}" role="button" style="${vars(t)};--delay:${Math.min(i, 8) * 40}ms">
      <div class="fallback">${logoImg(t)}</div>
      ${a.image ? `<img class="photo" src="${esc(a.image)}" alt="" draggable="false" onload="this.classList.add('on')" onerror="this.remove()">` : ""}
      <div class="shade"></div>
      <div class="text">
        <div class="kicker">${kicker(a, t)}<span class="read">Tap to read</span></div>
        <h2>${esc(a.title)}</h2>
        ${preview ? `<div class="preview">${esc(preview)}</div>` : ""}
      </div></div>`;
  }

  /* ---- Continuous scroll ----
     pos is a fractional card index: 0 = first story is the headliner, 1.5 = halfway between the 2nd and 3rd.
     The card at floor(pos) shrinks from double width as the next one grows, so whatever is leftmost is the headliner. */
  const LEFT = 40, GAP = 24, BASE = 592, HERO = 1208, PX_PER_CARD = 700;
  let list = [], cardEls = [], pos = 0, vel = 0, raf = 0, drag = null, moved = 0;
  const clampPos = (p) => Math.max(0, Math.min(Math.max(0, list.length - 1), p));

  function layout() {
    const n = Math.floor(pos), f = pos - n;
    const w = cardEls.map((_, i) => BASE + (HERO - BASE) * (i === n ? 1 - f : i === n + 1 ? f : 0));
    const x = [];
    if (cardEls.length) x[n] = LEFT - f * (w[n] + GAP);
    for (let i = n + 1; i < cardEls.length; i++) x[i] = x[i - 1] + w[i - 1] + GAP;
    for (let i = n - 1; i >= 0; i--) x[i] = x[i + 1] - GAP - w[i];
    cardEls.forEach((el, i) => {
      const off = x[i] + w[i] < -60 || x[i] > 2620;
      el.style.visibility = off ? "hidden" : "";
      if (off) return;
      el.style.left = `${x[i]}px`;
      el.style.width = `${w[i]}px`;
      el.style.setProperty("--w", ((w[i] - BASE) / (HERO - BASE)).toFixed(3));
    });
    const last = cardEls.length - 1;
    document.getElementById("row").style.setProperty("--fade-r", last >= 0 && x[last] + w[last] > 2500 ? "240px" : "0px");
  }

  // Momentum after a swipe, then a gentle settle onto the nearest card.
  function tick(t0) {
    cancelAnimationFrame(raf);
    let prev = t0;
    const step = (t) => {
      const dt = Math.min(48, t - prev); prev = t;
      if (Math.abs(vel) > 0.0004) {
        pos = clampPos(pos + vel * dt);
        vel *= Math.pow(0.94, dt / 16);
        if (pos === 0 || pos === list.length - 1) vel = 0;
      } else {
        vel = 0;
        const target = Math.round(pos), d = target - pos;
        if (Math.abs(d) < 0.001) { pos = target; layout(); return; }
        pos += d * Math.min(1, dt / 90);
      }
      layout();
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  const row = document.getElementById("row");
  row.addEventListener("pointerdown", (e) => {
    cancelAnimationFrame(raf); cancelAnimationFrame(glideRaf);
    drag = { x: e.clientX, pos, lastX: e.clientX, lastT: e.timeStamp, id: e.pointerId };
    moved = 0; vel = 0;
  });
  addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = (e.clientX - drag.x) / scale;
    moved = Math.max(moved, Math.abs(dx));
    if (moved > 8 && !row.classList.contains("dragging")) { row.classList.add("dragging"); row.setPointerCapture?.(e.pointerId); }
    pos = clampPos(drag.pos - dx / PX_PER_CARD);
    const dt = e.timeStamp - drag.lastT;
    if (dt > 0) vel = vel * 0.6 + 0.4 * (-(e.clientX - drag.lastX) / scale / PX_PER_CARD / dt);
    drag.lastX = e.clientX; drag.lastT = e.timeStamp;
    layout();
  });
  const endDrag = (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (moved <= 8 || e.timeStamp - drag.lastT > 80) vel = 0;   // a tap, or the finger stopped before lifting
    drag = null; row.classList.remove("dragging");
    tick(performance.now());
  };
  addEventListener("pointerup", endDrag);
  addEventListener("pointercancel", endDrag);
  row.addEventListener("wheel", (e) => {
    e.preventDefault(); cancelAnimationFrame(glideRaf);
    pos = clampPos(pos + (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) / PX_PER_CARD);
    vel = 0; layout(); tick(performance.now());
  }, { passive: false });
  row.addEventListener("click", (e) => {
    const c = e.target.closest(".card");
    if (c && moved <= 8) openReader(list[+c.dataset.i]);
  });

  // ---- Reader ----
  const READER_SWIPE_ZONE = "#reader .r-photo";
  let readerIdx = -1;
  function openReader(a) {
    if (!a) return;
    readerIdx = list.indexOf(a);
    const r0 = document.getElementById("reader");
    r0.querySelector(".r-pos").textContent = readerIdx >= 0 ? `${readerIdx + 1} of ${list.length}` : "";
    r0.querySelectorAll("[data-step]").forEach((b) => { b.disabled = readerIdx < 0 || !list[readerIdx + +b.dataset.step]; });
    const t = byAbbr[selected] || byAbbr[a.teams[0]] || LEAGUE;
    const r = document.getElementById("reader");
    const photo = r.querySelector(".r-photo");
    photo.style.backgroundImage = a.image ? `url("${a.image.replace(/"/g, "%22")}")` : "";
    photo.innerHTML = a.image ? "" : logoImg(t, "logo");
    r.querySelector(".kicker").innerHTML = kicker(a, t);
    r.querySelector("h2").innerHTML = linkPlayers(a.title, a.players, esc);
    const body = a.body || [];
    r.querySelector(".r-body").innerHTML = body.length
      ? body.map((p) => `<p>${linkPlayers(p, a.players, esc)}</p>`).join("")
      : `<p style="color:var(--text-3)">No preview for this story yet. It will appear after the next news update.</p>`;
    r.querySelector(".r-body").scrollLeft = 0;
    r.querySelector(".r-link").href = a.link;
    r.querySelector(".r-note").textContent = body.length ? "Opening paragraphs shown. Swipe sideways if the text runs on." : "";
    r.classList.add("open");
  }
  document.querySelector("#reader .r-close").onclick = () => document.getElementById("reader").classList.remove("open");
  // Previous / next story: the arrows in the footer, or a sideways swipe (on the photo on the Xeneon,
  // where the text itself scrolls sideways; anywhere on the phone).
  function stepReader(d) {
    const a = list[readerIdx + d]; if (!a) return;
    const r = document.getElementById("reader");
    r.classList.remove("slide-l", "slide-r"); void r.offsetWidth;
    openReader(a);
    r.classList.add(d > 0 ? "slide-l" : "slide-r");
  }
  document.querySelector("#reader .r-step").addEventListener("click", (e) => {
    const b = e.target.closest("[data-step]"); if (b && !b.disabled) stepReader(+b.dataset.step);
  });
  (() => {
    const zone = document.querySelector(READER_SWIPE_ZONE);
    // Touch events, since a touch that starts a scroll cancels its pointer events.
    let sx = 0, sy = 0, on = false;
    const start = (x, y) => { sx = x; sy = y; on = true; };
    const end = (x, y) => {
      if (!on) return; on = false;
      const dx = x - sx, dy = y - sy;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) stepReader(dx < 0 ? 1 : -1);
    };
    zone.addEventListener("touchstart", (e) => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
    zone.addEventListener("touchend", (e) => end(e.changedTouches[0].clientX, e.changedTouches[0].clientY), { passive: true });
    zone.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") start(e.clientX, e.clientY); });
    zone.addEventListener("pointerup", (e) => { if (e.pointerType === "mouse") end(e.clientX, e.clientY); });
  })();
  // A player's name opens his page; Back from there returns to the story.
  document.getElementById("reader").addEventListener("click", (e) => {
    const n = e.target.closest("[data-player]"); if (!n) return;
    const r = document.getElementById("reader");
    r.classList.remove("open");
    Sheet.open("player", { id: +n.dataset.player }, () => r.classList.add("open"));
  });

  function render() {
    const team = byAbbr[selected];
    applyTeamMode(team);
    list = (team ? articles.filter((a) => a.teams.includes(team.abbr)) : articles).slice(0, 20);
    row.innerHTML = list.length
      ? list.map((a, i) => card(a, team || byAbbr[a.teams[0]] || LEAGUE, i)).join("")
      : `<div class="empty">${team ? logoImg(team) : ""}<div>No recent news${team ? ` for the ${esc(team.name)}` : ""}</div></div>`;
    cardEls = [...row.querySelectorAll(".card")];
    pos = 0; vel = 0; cancelAnimationFrame(raf); cancelAnimationFrame(glideRaf);
    layout();
    document.querySelectorAll("#picker button").forEach((b) => b.classList.toggle("on", b.dataset.t === selected));
  }

  /* ---- Smooth refresh ----
     When new stories arrive, keep the cards already on screen (no re-fade, no photo reload) and add the new ones
     off to the left. If the strip is resting on the first story (or nobody is touching it), it then glides back
     so the new stories slide in as the headliner; otherwise it stays exactly where the user left it. */
  let glideRaf = 0;
  const preload = (src) => new Promise((ok) => {
    if (!src) return ok();
    const im = new Image(); const t = setTimeout(ok, 4000);
    im.onload = im.onerror = () => { clearTimeout(t); ok(); };
    im.src = src;
  });
  function refreshAges() {
    document.querySelectorAll(".age[data-d]").forEach((el) => {
      el.textContent = ago(el.dataset.d);
      const tag = el.parentNode.querySelector(".new");
      if (tag && minutes(el.dataset.d) >= NEW_MIN) tag.remove();
    });
  }
  async function merge() {
    const team = byAbbr[selected];
    const next = (team ? articles.filter((a) => a.teams.includes(team.abbr)) : articles).slice(0, 20);
    // Nothing to diff against, or nothing to show: a plain rebuild is fine.
    if (!cardEls.length || !next.length) return render();
    const before = cardEls;
    const old = new Map(list.map((a, i) => [a.link, cardEls[i]]));
    const fresh = next.filter((a) => !old.has(a.link));
    // Let new photos load first so they don't pop in mid-slide.
    await Promise.all(fresh.slice(0, 6).map((a) => preload(a.image)));
    if (cardEls !== before) return;   // the row was rebuilt (team change) while photos loaded
    // Which story is the user looking at, and how far between cards are they?
    const n = Math.floor(pos), anchor = list[n]?.link, frac = pos - n;
    const atStart = pos < 0.5 && !drag;
    const els = next.map((a, i) => {
      let el = old.get(a.link);
      if (el) {
        old.delete(a.link);
        el.dataset.i = i;
        // Stories can gain a body or a better headline between updates.
        const h = el.querySelector("h2"); if (h.textContent !== a.title) h.textContent = a.title;
      } else {
        const tmp = document.createElement("div");
        tmp.innerHTML = card(a, team || byAbbr[a.teams[0]] || LEAGUE, i);
        el = tmp.firstElementChild;
        el.style.setProperty("--delay", "0ms");
        row.appendChild(el);
      }
      return el;
    });
    // Cards are placed by layout(), so DOM order doesn't matter: kept cards are never moved, because
    // re-inserting a node restarts its CSS animations (the fade-in would replay).
    old.forEach((el) => el.remove());                // stories that aged out of the list
    const wasReading = readerIdx >= 0 ? list[readerIdx]?.link : null;
    list = next; cardEls = els;
    if (wasReading) {
      readerIdx = list.findIndex((a) => a.link === wasReading);
      const r = document.getElementById("reader");
      r.querySelector(".r-pos").textContent = readerIdx >= 0 ? `${readerIdx + 1} of ${list.length}` : "";
      r.querySelectorAll("[data-step]").forEach((b) => { b.disabled = readerIdx < 0 || !list[readerIdx + +b.dataset.step]; });
    }
    // Keep the same story in the same spot...
    const ai = anchor ? list.findIndex((a) => a.link === anchor) : -1;
    if (!drag) { cancelAnimationFrame(raf); vel = 0; }
    const was = pos;
    pos = clampPos(ai >= 0 ? ai + frac : Math.min(pos, list.length - 1));
    if (drag) drag.pos += pos - was;                // keep a finger that's down from jumping
    layout();
    // ...then, if they were at the front, glide back so the new stories slide in.
    if ((atStart || (Idle.isIdle() && !drag)) && pos > 0.001) glideTo(0);
  }
  function glideTo(target) {
    cancelAnimationFrame(glideRaf); cancelAnimationFrame(raf);
    const from = pos, dist = Math.abs(from - target);
    const dur = Math.min(2200, 900 + 260 * dist);
    const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const t0 = performance.now();
    const step = (t) => {
      if (drag) return;                                // a touch takes over
      const k = Math.min(1, (t - t0) / dur);
      pos = from + (target - from) * ease(k);
      layout();
      if (k < 1) glideRaf = requestAnimationFrame(step);
    };
    glideRaf = requestAnimationFrame(step);
  }

  function buildPicker() {
    const f = Settings.fav();
    // All teams, then the favorite, then everyone else A-Z.
    const opts = [{ abbr: "ALL" }, ...(f ? [f] : []), ...[...TEAMS].filter((t) => t !== f).sort((a, b) => a.abbr.localeCompare(b.abbr))];
    document.getElementById("picker").innerHTML = opts.map((t) =>
      `<button data-t="${t.abbr}" class="${t === f ? "fav" : ""}">${t.id ? logoImg(t) : `<svg class="all" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>`}${t.abbr}</button>`).join("");
  }
  function togglePicker(open) {
    document.getElementById("picker").classList.toggle("open", open);
    document.getElementById("scrim").classList.toggle("open", open);
  }
  document.getElementById("picker-btn").onclick = () => togglePicker(!document.getElementById("picker").classList.contains("open"));
  document.getElementById("scrim").onclick = () => togglePicker(false);
  document.getElementById("picker-clear").onclick = () => {
    selected = "ALL"; save("team", selected); render(); VIEWS[activeTab]?.teamChanged(); if (activeTab === "news") HotStove.teamChanged();
  };
  document.addEventListener("favchange", () => { buildPicker(); render(); });
  document.getElementById("picker").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    selected = b.dataset.t; save("team", selected); togglePicker(false); render();
    VIEWS[activeTab]?.teamChanged();
    if (activeTab === "news") HotStove.teamChanged();
  };

  /* ---- Tabs ----
     News is this file; Scores, Standings and Rosters live in scores.js, standings.js and team.js.
     Each keeps its own "Updated" text for the corner. */
  const VIEWS = { myteam: MyTeam, scores: Scores, standings: Standings, rosters: Rosters };
  const updatedText = {};
  let activeTab = "news";
  function setUpdated(tab, text) {
    updatedText[tab] = text;
    if (tab === activeTab) document.getElementById("updated").textContent = text;
  }
  function setTab(t) {
    if (!["myteam", "news", "scores", "standings", "rosters"].includes(t)) t = "news";
    if (activeTab !== t) VIEWS[activeTab]?.hide();
    activeTab = t; save("tab", t); document.dispatchEvent(new CustomEvent("tabchange"));
    document.querySelectorAll("nav .tab").forEach((el) => el.classList.toggle("on", el.dataset.tab === t));
    document.querySelectorAll(".view").forEach((el) => el.classList.toggle("on", el.id === `view-${t}`));
    document.getElementById("ctx").innerHTML = "";
    document.getElementById("updated").textContent = updatedText[t] || "";
    togglePicker(false);
    if (t === "news") HotStove.show(); else VIEWS[t].show();
  }
  document.querySelector("nav").onclick = (e) => {
    const el = e.target.closest("[data-tab]"); if (!el) return;
    if (Sheet.isOpen()) Sheet.close();
    setTab(el.dataset.tab);
  };

  async function refresh() {
    try {
      const data = await (await fetch(`news.json?t=${Date.now()}`, { cache: "no-store" })).json();
      setUpdated("news", `Updated ${new Date(data.updated).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`);
      // Only rebuild the row when the stories changed, so a refresh doesn't yank the user back to the start.
      const key = (data.articles || []).map((a) => a.link).join("|");
      const first = !lastKey;
      articles = data.articles || [];
      if (key !== lastKey) { lastKey = key; if (first) render(); else await merge(); }
      refreshAges();
    } catch (e) {
      setUpdated("news", "Couldn't load news");
    }
  }

  buildPicker(); render(); refresh(); setInterval(refresh, REFRESH_MS);
  Sheet.init(); Settings.init(); Scores.init(); Standings.init(); Rosters.init(); MyTeam.init(); LiveBar.init(); Search.init(); HotStove.init(); Idle.init();
  setTab(load("tab") || "news");

  /* Self-update: iCUE's web view holds on to old copies of the page, so a deploy could go unseen for days.
     The deploy stamps BUILD into this page and writes version.json; when they differ, reload. */
  const BUILD = "__BUILD__";
  async function checkVersion() {
    if (BUILD.startsWith("__")) return;   // local copy, not a deploy
    try {
      const v = await (await fetch(`version.json?t=${Date.now()}`, { cache: "no-store" })).json();
      if (v.build && v.build !== BUILD && (!Sheet.isOpen() || Idle.isIdle())) location.replace(`${location.pathname}?v=${v.build}${location.hash}`);
    } catch (e) {}
  }
  setInterval(checkVersion, 60 * 1000);
</script>
</body>
</html>
