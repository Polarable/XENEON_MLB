function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderBrefHits(hits){
  if(!hits.length){
    openBrefResults('<div class="hit-empty">No players found. Try a last name (e.g. Stanton) or full name.</div>');
    return;
  }
  openBrefResults(hits.map((p,i)=>{
    const shot=p.headshot_url || (p.mlbam_id ? mlbStudioHeadshotSafe(p.mlbam_id) : '');
    const meta=[p.team, hitYearsLabel(p)].filter(Boolean).join(' · ');
    return `<div class="hit${i===0?' active':''}" data-i="${i}">
      ${shot?`<img class="hit-shot" src="${escapeHtml(shot)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.opacity=.25">`:''}
      <div class="hit-body">
        <span class="hit-name">${escapeHtml(p.name)}</span>
        <span class="meta">${escapeHtml(meta)}</span>
      </div>
      <span class="hit-pos">${escapeHtml(p.position||(p._pitcher?'P':''))}</span>
    </div>`;
  }).join(''));
}

let brefDebounceTimer=null;
let brefSearchToken=0;

async function searchBrefPlayers(){
  const q=(document.getElementById('brefSearch').value||'').trim();
  if(q.length<2){
    closeBrefResults();
    setBrefStatus('Type a name to import batting & pitching careers');
    return;
  }
  const token=++brefSearchToken;
  setBrefStatus('Searching…');
  brefActiveIdx=0;
  openBrefResults('<div class="hit-empty">Searching MLB…</div>');
  try{
    const type=mode==='bat'?'batter':'pitcher';
    let hits = [];
    try { hits = await searchMlbDirect(q, type); } catch(_){}
    if(!hits.length){
      const backend = await searchPlayersBackend(q, type);
      hits = rankPlayerHits(backend.map(p=>({
        ...p,
        _pitcher: p.player_type==='pitcher' || p.position==='P',
        active: !!p.active,
      })), q).slice(0, 15);
    }
    if(token!==brefSearchToken) return;
    brefHits=hits;
    renderBrefHits(brefHits);
    if(!brefHits.length){
      setBrefStatus('No matches — try last name only');
      return;
    }
    setBrefStatus(`${brefHits.length} match${brefHits.length===1?'':'es'} — click or press Enter`);
  }catch(e){
    if(token!==brefSearchToken) return;
    setBrefStatus(e.message||'Search failed');
    openBrefResults(`<div class="hit-empty">${escapeHtml(e.message||'Search failed')}</div>`);
  }
}

function selectBrefHit(i){
  brefSelected=brefHits[i]||null;
  brefActiveIdx=i;
  if(!brefSelected) return;
  document.getElementById('brefSearch').value=brefSelected.name;
  closeBrefResults();
  if(!brefSelected.bbref_id && !brefSelected.mlbam_id){
    setBrefStatus('Selected player has no lookup ids');
    return;
  }
  void importSelectedBref();
}

async function importSelectedBref(){
  if(!brefSelected||(!brefSelected.bbref_id && !brefSelected.mlbam_id)){
    setBrefStatus('Search and select a player first');
    return;
  }
  setBrefStatus(`Loading ${brefSelected.name}'s career (hitting + pitching)…`);
  try{
    const awardsByYear = brefSelected.mlbam_id ? await fetchMlbAwards(brefSelected.mlbam_id) : {};
    const [batPayload, pitPayload] = await Promise.all([
      fetchCareerPayload('batter').catch(()=>null),
      fetchCareerPayload('pitcher').catch(()=>null),
    ]);
    if(!batPayload?.seasons?.length && !pitPayload?.seasons?.length){
      throw new Error('No seasons returned');
    }
    applyBrefCareerDual(batPayload, pitPayload, awardsByYear);
    const nBat = batPayload?.seasons?.length || 0;
    const nPit = pitPayload?.seasons?.length || 0;
    const via = (batPayload||pitPayload)?.source==='mlb-statsapi' ? 'MLB.com' : 'Baseball-Reference';
    setBrefStatus(`Imported bat ${nBat} / pit ${nPit} season rows via ${via}`);
    toast(via==='MLB.com' ? 'CAREER LOADED VIA MLB.COM' : 'BBREF CAREER LOADED');
  }catch(e){
    setBrefStatus(e.message||'Import failed');
    toast('IMPORT FAILED');
  }
}

function uniqueSeasonCount(rows){
  return new Set((rows||[]).map(r=>String(r.season||'')).filter(Boolean)).size;
}

function pickModeBySeasonVolume(batRows, pitRows){
  const batN=uniqueSeasonCount(batRows);
  const pitN=uniqueSeasonCount(pitRows);
  if(pitN>batN) return 'pit';
  if(batN>pitN) return 'bat';
  // Tie: prefer more rows, then batting
  const batR=(batRows||[]).length;
  const pitR=(pitRows||[]).length;
  if(pitR>batR) return 'pit';
  return 'bat';
}

function applyBrefCareerDual(batPayload, pitPayload, awardsByYear){
  const name = batPayload?.name || pitPayload?.name || brefSelected?.name || '';
  setPlayerName(name);
  const yearSet=new Set();
  [...(batPayload?.seasons||[]), ...(pitPayload?.seasons||[])].forEach(s=>{
    if(s?.season) yearSet.add(clampSeasonYear(s.season));
  });
  const mid = brefSelected?.mlbam_id;
  setEditLocked(true);
  Promise.all([...yearSet].map(y=>fetchTeamsForSeason(y).catch(()=>[])))
    .then(()=>{
      data.bat.rows = seasonsToRows(batPayload, 'bat', awardsByYear || {});
      data.pit.rows = seasonsToRows(pitPayload, 'pit', awardsByYear || {});
      mode = pickModeBySeasonVolume(data.bat.rows, data.pit.rows);
      setModeButtons(mode);
      return Promise.all([
        attachTeamIdsForRows(data.bat.rows),
        attachTeamIdsForRows(data.pit.rows),
        applyImportedPlayerPhoto(batPayload, pitPayload),
      ]);
    })
    .finally(()=>{
      setPlayerBanner(mid || null);
      render();
      autosave();
    });
}

function applyBrefCareer(payload){
  applyBrefCareerDual(
    payload?.player_type==='pitcher' ? null : payload,
    payload?.player_type==='pitcher' ? payload : null,
    {}
  );
}

    if(mid){
      // Mode is chosen after import by which side has more seasons
      brefSelected = {
        mlbam_id: mid,
        name: name || `Player ${mid}`,
        bbref_id: '',
        player_type: (type === 'pitcher' || type === 'pit') ? 'pitcher' : 'batter',
        headshot_url: mlbStudioHeadshot(mid),
      };
      document.getElementById('brefSearch').value = brefSelected.name;
      setBrefStatus(`Importing ${brefSelected.name}…`);
      void importSelectedBref();
    }
  } catch(_){}
})();
</script>
</body>
</html>
