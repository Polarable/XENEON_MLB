name: wv2probe
on:
  push:
    branches: [claude/project-thread-2lmre5]
    paths: [".github/workflows/wv2probe.yml", "taskbar/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get WebView2 header
        run: |
          curl -sSL -o wv2.zip https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40
          unzip -q wv2.zip -d wv2
          mkdir -p tmp && cp wv2/build/native/include/WebView2.h tmp/WebView2.h
          ls -la tmp
      - name: Compile check
        if: hashFiles('taskbar/shutout-taskbar.wh.cpp') != ''
        run: |
          sudo apt-get install -y -q g++-mingw-w64-x86-64 >/dev/null
          mkdir -p stub && cat > stub/windhawk_api.h <<'H'
          #pragma once
          #include <windows.h>
          #define WH_MOD_API
          inline int Wh_GetIntSetting(const wchar_t*, ...) { return 0; }
          inline const wchar_t* Wh_GetStringSetting(const wchar_t*, ...) { return L""; }
          inline void Wh_FreeStringSetting(const wchar_t*) {}
          #define Wh_Log(...) ((void)0)
          inline BOOL Wh_SetFunctionHook(void*, void*, void**) { return TRUE; }
          H
          printf '#include "windhawk_api.h"\n#include "../taskbar/shutout-taskbar.wh.cpp"\n' > stub/main.cpp
          x86_64-w64-mingw32-g++ -std=c++20 -shared -o mod.dll stub/main.cpp -Istub -lole32 -loleaut32 -lshlwapi -lshell32 -luser32 -ldwmapi -luuid -static 2>&1 | tee build.log | head -80
          test -f mod.dll && echo BUILD_OK
      - name: Commit header
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add tmp/WebView2.h
          git diff --cached --quiet || (git commit -m "tmp: WebView2 header for the taskbar mod" && git push)
