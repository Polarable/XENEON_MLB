name: Update news
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes, off the busy :00/:15 marks GitHub often delays or drops
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50   # the build id needs history to skip news-only commits
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-logos.js
      - run: node scripts/fetch-news.js
      # Film Room clips as WebM: iCUE's browser can't play MLB's H.264 files. Not committed;
      # kept between runs in the Actions cache and published with the site.
      - name: Restore converted clips
        uses: actions/cache/restore@v4
        with:
          path: clips
          key: clips-${{ github.run_id }}
          restore-keys: clips-
      - name: Convert new clips
        id: clips
        continue-on-error: true
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          node scripts/fetch-clips.js
      - name: Keep converted clips for the next run
        if: steps.clips.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: clips
          key: clips-${{ github.run_id }}
      - name: Save news and logos (keeps thumbnails cached between runs)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update news [skip ci]" && git push)
      - name: Stamp build id (busts iCUE's cache; not committed)
        run: |
          BUILD=$(git log -1 --format=%h -- . ':!news.json' ':!img' ':!logos')
          sed -i "s/__BUILD__/$BUILD/g" index.html
          echo "{\"build\":\"$BUILD\"}" > version.json
          cat version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
