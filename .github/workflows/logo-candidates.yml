# Temporary: downloads candidate logo files for a few teams so they can be compared. Removed after use.
name: Logo candidates
on:
  push:
    branches: [claude/project-thread-452blc]
    paths: [.github/workflows/logo-candidates.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p logo-candidates && cd logo-candidates
          get() { curl -sSfL -A "Mozilla/5.0 (logo comparison)" -m 30 -o "$1" "$2" && echo "ok $1 <- $2" || { rm -f "$1"; echo "miss $1 <- $2"; }; }
          W="https://commons.wikimedia.org/wiki/Special:FilePath"
          for n in Houston_Astros_cap_logo.svg Houston_Astros_Insignia.svg Houston_Astros_Cap_Insignia.svg Houston_Astros_star_logo.svg Chicago_Cubs_Cap_Insignia.svg NLC-CHC-Insignia.png Chicago_Cubs_Insignia.svg; do
            get "W-$n" "$W/$n"
          done
          for q in "Astros insignia" "Astros star H" "Houston Astros svg" "Cubs insignia svg"; do
            curl -sS -A "Mozilla/5.0 (logo comparison)" "https://commons.wikimedia.org/w/api.php?action=query&list=search&srnamespace=6&srlimit=15&format=json&srsearch=$(echo "$q" | sed 's/ /+/g')" >> wiki-search2.jsonl; echo >> wiki-search2.jsonl
          done
          ls -la
      - name: Commit
        run: |
          git config user.name "logo-bot"; git config user.email "logo-bot@users.noreply.github.com"
          git add logo-candidates && git commit -m "Logo candidates 2 [skip ci]" && git push
