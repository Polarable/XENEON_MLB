name: API probe (temporary)
on:
  push:
    branches: [claude/project-thread-2lmre5]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A=https://statsapi.mlb.com
          p() { echo "=== $1"; curl -s "$A$1" | head -c ${2:-1500}; echo; }
          p "/api/v1/people/670541/stats?stats=vsPlayer&opposingPlayerId=543037&group=hitting&sportId=1" 2500
          p "/api/v1/people/freeAgents?season=2026" 2500
          p "/api/v1/transactions?sportId=1&startDate=2026-10-28&endDate=2026-11-03" 2500
          p "/api/v1/people/search?names=pujols&sportIds=1" 800
          p "/api/v1/teams/117/leaders?leaderCategories=homeRuns,strikeouts&season=2026&statGroup=pitching&limit=1" 1200
          p "/api/v1/stats/leaders?leaderCategories=homeRuns,battingAverage&season=2026&statGroup=hitting&sportId=1&limit=2&leagueId=103" 1500
          p "/api/v1/sports/1/players?season=2026&fields=people,id,fullName,primaryPosition,abbreviation,currentTeam" 400
